services:
  postgres:
    image: postgres:16-alpine
    container_name: salescube_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: salescube
      POSTGRES_PASSWORD: salescube
      POSTGRES_DB: salescube
    ports:
      - "5432:5432"
    volumes:
      - salescube_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salescube -d salescube"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: salescube_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@salescube.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  salescube_pg_data:
    name: salescube_pg_data
